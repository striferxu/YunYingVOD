name: Release APK

# 触发方式：推送 v* 形式的 tag（例如 v0.1.0）
# 也可以在 Actions 页面手动触发（workflow_dispatch），用于演练。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（仅手动触发时用于命名 Release，如 v0.1.0）'
        required: false
        default: 'v0.0.0-manual'

permissions:
  contents: write   # 创建 Release 需要

jobs:
  build-and-release:
    name: Build signed APK and publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Flutter 版本必须与本机一致（3.50.1 / Dart 3.14.0），否则 material_ui 等包解析会失败
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 依赖：pubspec.lock 已入库，用 --enforce-lockfile 保证 CI 与本机依赖完全一致
      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # ---- 从 Secrets 还原签名材料 ----
      # KEYSTORE_BASE64 是 vodapp.jks 的 base64 单行字符串
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret 未配置，无法生成签名 APK"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/vodapp.jks
          ls -l android/vodapp.jks

      # key.properties 由 Secrets 现场生成，不入库
      - name: Write key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=vodapp.jks
          EOF
          # 只打印字段名，绝不打印值
          cut -d= -f1 android/key.properties

      # 版本号：tag 去掉前导 v 作为 versionName（v0.1.0 → 0.1.0），
      # versionCode 用 run_number 单调递增，保证可以覆盖升级。
      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          fi
          NAME="${TAG#v}"
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "versionName=$NAME versionCode=${{ github.run_number }}"

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.ver.outputs.name }}" \
            --build-number="${{ github.run_number }}"

      # 校验签名：必须用 release 证书，且 minSdk 与真机验收一致
      - name: Verify APK signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -l "$APK"
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          if grep -q "CN=Android Debug" /tmp/certs.txt; then
            echo "::error::APK 使用了 debug 签名，拒绝发布"
            exit 1
          fi
          # 记录指纹，便于人工核对
          grep "SHA-256" /tmp/certs.txt || true

      - name: Show APK info
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT=$(find $ANDROID_HOME/build-tools -name aapt2 | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | head -5

      # ---- 打包产物命名 ----
      - name: Rename artifact
        id: artifact
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          NAME="yunying-vod-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$NAME"
          echo "name=$NAME" >> $GITHUB_OUTPUT
          sha256sum "$NAME" | tee "$NAME.sha256"

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            ${{ steps.artifact.outputs.name }}
            ${{ steps.artifact.outputs.name }}.sha256
          retention-days: 30

      # ---- 创建 GitHub Release ----
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 云影 VOD ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: false
          body: |
            ## 云影 VOD ${{ steps.ver.outputs.tag }}

            Android 客户端安装包（release 签名）。

            ### 安装
            1. 下载下方 `.apk` 文件
            2. 手机允许「安装未知来源应用」后点击安装
            3. 覆盖安装可直接升级，登录态保留

            ### 校验
            ```
            sha256: 见 .apk.sha256 附件
            ```

            ### 已知限制
            - 蜂窝网络上传大文件（>300 秒）可能被服务端超时中断，建议 WiFi 上传
            - 转码服务器单并发，多人同时上传需排队
            - 用户审核 / 视频管理等 admin 功能请使用 Web 端
            - 改密码后所有设备需重新登录

            ### 完整变更
            见 [提交历史](https://github.com/${{ github.repository }}/commits/${{ steps.ver.outputs.tag }})
          files: |
            ${{ steps.artifact.outputs.name }}
            ${{ steps.artifact.outputs.name }}.sha256
          fail_on_unmatched_files: true

      # 清理签名材料（runner 是一次性的，但显式删除更稳妥）
      - name: Cleanup signing material
        if: always()
        run: |
          rm -f android/vodapp.jks android/key.properties || true

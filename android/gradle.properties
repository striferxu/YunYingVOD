org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ---- 本机（Windows）构建修正，勿删 ----
# 现象：device_info_plus / connectivity_plus 的 compileDebugKotlin 报
#   "Could not close incremental caches ... class-fq-name-to-source.tab ..."
# 原因：Kotlin 增量编译在 Windows 上关闭 .tab 文件句柄的时序问题（插件源码未变也复现，
#       清 build/ 后仍复现）。关掉增量编译即可，代价只是插件 Kotlin 模块全量重编（约 +40s）。
kotlin.incremental=false
kotlin.incremental.android=false
# 顺带避免 Gradle 文件系统监听在 Windows 上占用句柄
org.gradle.vfs.watch=false
